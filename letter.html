<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Резиденция Деда Мороза</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Open+Sans:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header"><h1>Резиденция Деда Мороза</h1></div>

  <div class="card">
    <h2>Письмо Деду Морозу</h2>
    <p class="text">Поделитесь мечтой или задайте свой вопрос.</p>
    <form action="sent.html">
      <input type="text" name="name" placeholder="Имя" required>
      <input type="text" name="contact" placeholder="Контакт" required>
      <textarea name="message" placeholder="Текст письма" required></textarea>
      <button class="red" type="submit">Отправить</button>
    </form>
    <a class="back" href="index.html">Вернуться на главную</a>
  </div>

</body>
</html>
